<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>A.I.R.I Chat</title>
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --border: #30363d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent: #e29e38;
    --accent-dim: #e29e3833;
    --user-bubble: #1c2333;
    --assistant-bubble: #161b22;
    --code-bg: #0d1117;
    --danger: #f85149;
    --success: #3fb950;
    --scrollbar: #30363d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    height: 100dvh; /* dynamic viewport height — accounts for browser chrome */
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* Safe area insets for notched/dynamic-island devices */
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
  }

  .status-dot.connected { background: var(--success); }

  select {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    max-width: 240px;
    min-width: 120px;
  }

  select:focus { outline: none; border-color: var(--accent); }

  .header-spacer { flex: 1; }

  .btn {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .btn:hover { background: var(--border); color: var(--text-primary); }
  .btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .btn.loading { opacity: 0.6; cursor: wait; }
  .btn.load-btn { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .btn.unload-btn { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn.load-btn:hover { background: var(--accent); color: #000; }
  .btn.unload-btn:hover { background: var(--danger); color: #000; }

  /* Chat container */
  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #chat-container::-webkit-scrollbar { width: 6px; }
  #chat-container::-webkit-scrollbar-track { background: transparent; }
  #chat-container::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  .message {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .message.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border: 1px solid var(--border);
    border-bottom-right-radius: 4px;
  }

  .message.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .message .role-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .message.user .role-label { color: var(--accent); }

  .message .content p { margin-bottom: 8px; }
  .message .content p:last-child { margin-bottom: 0; }
  .message .content ul, .message .content ol { margin: 8px 0; padding-left: 20px; }
  .message .content li { margin-bottom: 4px; }
  .message .content strong { font-weight: 600; }
  .message .content em { font-style: italic; }
  .message .content a { color: var(--accent); text-decoration: none; }
  .message .content a:hover { text-decoration: underline; }
  .message .content h1, .message .content h2, .message .content h3 {
    margin: 12px 0 6px;
    font-weight: 600;
  }
  .message .content h1 { font-size: 1.3em; }
  .message .content h2 { font-size: 1.15em; }
  .message .content h3 { font-size: 1.05em; }

  /* Code blocks */
  .code-block {
    position: relative;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 12px;
    background: var(--bg-tertiary);
    font-size: 12px;
    color: var(--text-muted);
  }

  .copy-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .copy-btn:hover { background: var(--border); color: var(--text-primary); }

  .code-block pre {
    margin: 0;
    padding: 12px;
    background: var(--code-bg);
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
  }

  .code-block pre code {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    color: var(--text-primary);
  }

  /* Inline code */
  .message .content code:not(.code-block code) {
    background: var(--bg-tertiary);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
  }

  /* Speed indicator */
  .speed-indicator {
    font-size: 11px;
    color: var(--text-muted);
    padding: 2px 0;
    text-align: center;
    flex-shrink: 0;
  }

  /* System prompt */
  .system-prompt-area {
    padding: 8px 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: none;
    flex-shrink: 0;
  }

  .system-prompt-area.visible { display: block; }

  .system-prompt-area textarea {
    width: 100%;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 48px;
    max-height: 120px;
  }

  .system-prompt-area textarea:focus { outline: none; border-color: var(--accent); }

  .system-prompt-area label {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* Footer / Input */
  footer {
    padding: 14px 16px;
    padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  #message-input {
    flex: 1;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 42px;
    max-height: 160px;
    line-height: 1.5;
    overflow-y: auto;
  }

  #message-input:focus { outline: none; border-color: var(--accent); }
  #message-input::placeholder { color: var(--text-muted); }

  #send-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    height: 42px;
    transition: opacity 0.15s;
  }

  #send-btn:hover { opacity: 0.9; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Welcome */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    gap: 8px;
    padding: 40px;
    text-align: center;
  }

  .welcome h2 { font-size: 20px; color: var(--text-secondary); }
  .welcome p { font-size: 14px; max-width: 360px; }

  /* Cursor blink for streaming */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 0.8s step-end infinite;
    vertical-align: text-bottom;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* Responsive */
  @media (max-width: 600px) {
    .message { max-width: 95%; }
    header { gap: 8px; padding: 10px 12px; }
    .logo { font-size: 15px; }
    select { max-width: 140px; font-size: 12px; }
    .btn { padding: 5px 8px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">A.I.R.I</span>
  <div class="status-dot" id="status-dot" title="Disconnected"></div>
  <select id="model-select"><option value="">Loading models...</option></select>
  <button class="btn load-btn" id="load-btn" title="Load selected model" disabled>Load</button>
  <div class="header-spacer"></div>
  <button class="btn" id="system-btn" title="Toggle system prompt">System</button>
  <button class="btn" id="clear-btn" title="Clear conversation">Clear</button>
</header>

<div class="system-prompt-area" id="system-prompt-area">
  <label for="system-prompt">System Prompt</label>
  <textarea id="system-prompt" placeholder="You are a helpful assistant..." rows="2"></textarea>
</div>

<div id="chat-container">
  <div class="welcome" id="welcome">
    <h2>A.I.R.I Chat</h2>
    <p>Select a model and start chatting. Your messages are processed locally on the connected device.</p>
  </div>
</div>

<div class="speed-indicator" id="speed-indicator"></div>

<footer>
  <div class="input-row">
    <textarea id="message-input" placeholder="Send a message... (Shift+Enter for new line)" rows="1"></textarea>
    <button id="send-btn" disabled>Send</button>
  </div>
</footer>

<script>
(function() {
  'use strict';

  // State
  let messages = [];
  let selectedModel = '';
  let loadedModel = '';
  let isGenerating = false;
  let isLoadingModel = false;
  let abortController = null;

  // Elements
  const chatContainer = document.getElementById('chat-container');
  const welcome = document.getElementById('welcome');
  const input = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const modelSelect = document.getElementById('model-select');
  const loadBtn = document.getElementById('load-btn');
  const statusDot = document.getElementById('status-dot');
  const clearBtn = document.getElementById('clear-btn');
  const systemBtn = document.getElementById('system-btn');
  const systemArea = document.getElementById('system-prompt-area');
  const systemPrompt = document.getElementById('system-prompt');
  const speedIndicator = document.getElementById('speed-indicator');

  // Auto-resize textarea
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  input.addEventListener('input', () => autoResize(input));

  // Toggle system prompt
  systemBtn.addEventListener('click', () => {
    systemArea.classList.toggle('visible');
    systemBtn.classList.toggle('active');
  });

  // Clear conversation
  clearBtn.addEventListener('click', () => {
    messages = [];
    chatContainer.innerHTML = '';
    chatContainer.appendChild(welcome);
    welcome.style.display = 'flex';
    speedIndicator.textContent = '';
  });

  // Update load button state based on selected vs loaded model
  function updateLoadButton() {
    if (!selectedModel) {
      loadBtn.disabled = true;
      loadBtn.textContent = 'Load';
      loadBtn.className = 'btn load-btn';
      sendBtn.disabled = true;
      return;
    }
    if (isLoadingModel) {
      loadBtn.disabled = true;
      loadBtn.textContent = 'Loading…';
      loadBtn.className = 'btn load-btn loading';
      sendBtn.disabled = true;
      return;
    }
    if (selectedModel === loadedModel) {
      loadBtn.textContent = 'Unload';
      loadBtn.className = 'btn unload-btn';
      loadBtn.disabled = false;
      sendBtn.disabled = false;
    } else {
      loadBtn.textContent = 'Load';
      loadBtn.className = 'btn load-btn';
      loadBtn.disabled = false;
      sendBtn.disabled = true;
    }
  }

  // Fetch loaded model status
  async function fetchLoadedModel() {
    try {
      const res = await fetch('/api/ps');
      const data = await res.json();
      if (data.models && data.models.length > 0) {
        loadedModel = data.models[0].name || '';
      } else {
        loadedModel = '';
      }
    } catch (_) {
      loadedModel = '';
    }
    updateLoadButton();
  }

  // Fetch models
  async function fetchModels() {
    try {
      const res = await fetch('/api/tags');
      const data = await res.json();
      const prevSelected = selectedModel;
      modelSelect.innerHTML = '';
      if (data.models && data.models.length > 0) {
        data.models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.name;
          opt.textContent = m.name;
          modelSelect.appendChild(opt);
        });
        // Preserve previous selection if still available
        if (prevSelected && data.models.some(m => m.name === prevSelected)) {
          modelSelect.value = prevSelected;
          selectedModel = prevSelected;
        } else {
          selectedModel = data.models[0].name;
        }
        statusDot.classList.add('connected');
        statusDot.title = 'Connected';
      } else {
        modelSelect.innerHTML = '<option value="">No models found</option>';
        selectedModel = '';
        statusDot.classList.remove('connected');
        statusDot.title = 'No models available';
      }
    } catch (e) {
      modelSelect.innerHTML = '<option value="">Connection failed</option>';
      selectedModel = '';
      statusDot.classList.remove('connected');
      statusDot.title = 'Connection failed';
    }
    await fetchLoadedModel();
  }

  modelSelect.addEventListener('change', () => {
    selectedModel = modelSelect.value;
    updateLoadButton();
  });

  // Load or unload model
  loadBtn.addEventListener('click', async () => {
    if (!selectedModel || isLoadingModel) return;

    if (selectedModel === loadedModel) {
      // Unload
      isLoadingModel = true;
      updateLoadButton();
      try {
        const res = await fetch('/api/unload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        if (res.ok) {
          loadedModel = '';
        } else {
          const err = await res.json().catch(() => ({}));
          alert('Unload failed: ' + (err.error || res.statusText));
        }
      } catch (e) {
        alert('Unload failed: ' + e.message);
      }
      isLoadingModel = false;
      updateLoadButton();
      return;
    }

    // Load
    isLoadingModel = true;
    updateLoadButton();
    try {
      const res = await fetch('/api/load', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: selectedModel }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        loadedModel = selectedModel;
      } else {
        alert('Load failed: ' + (data.error || res.statusText));
      }
    } catch (e) {
      alert('Load failed: ' + e.message);
    }
    isLoadingModel = false;
    updateLoadButton();
  });

  // Markdown renderer (lightweight)
  function renderMarkdown(text) {
    // Escape HTML
    let html = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // Code blocks
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
      const langLabel = lang || 'code';
      const id = 'code-' + Math.random().toString(36).substr(2, 9);
      return `<div class="code-block"><div class="code-block-header"><span>${langLabel}</span><button class="copy-btn" onclick="copyCode('${id}')">Copy</button></div><pre><code id="${id}">${code.trim()}</code></pre></div>`;
    });

    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Headers
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

    // Bold and italic
    html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

    // Links
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // Unordered lists
    html = html.replace(/^[\s]*[-*] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

    // Ordered lists
    html = html.replace(/^[\s]*\d+\. (.+)$/gm, '<li>$1</li>');

    // Paragraphs (double newlines)
    html = html.replace(/\n\n/g, '</p><p>');
    html = '<p>' + html + '</p>';

    // Clean up empty paragraphs
    html = html.replace(/<p>\s*<\/p>/g, '');
    html = html.replace(/<p>\s*(<h[1-3]>)/g, '$1');
    html = html.replace(/(<\/h[1-3]>)\s*<\/p>/g, '$1');
    html = html.replace(/<p>\s*(<div class="code-block">)/g, '$1');
    html = html.replace(/(<\/div>)\s*<\/p>/g, '$1');
    html = html.replace(/<p>\s*(<ul>)/g, '$1');
    html = html.replace(/(<\/ul>)\s*<\/p>/g, '$1');

    // Single newlines -> <br>
    html = html.replace(/\n/g, '<br>');

    return html;
  }

  // Copy code helper (global)
  window.copyCode = function(id) {
    const el = document.getElementById(id);
    if (el) {
      navigator.clipboard.writeText(el.textContent).then(() => {
        const btn = el.closest('.code-block').querySelector('.copy-btn');
        if (btn) {
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = 'Copy', 1500);
        }
      });
    }
  };

  // Render a message bubble
  function createMessageEl(role, content, streaming) {
    const div = document.createElement('div');
    div.className = 'message ' + role;

    const label = document.createElement('div');
    label.className = 'role-label';
    label.textContent = role === 'user' ? 'You' : 'A.I.R.I';
    div.appendChild(label);

    const contentDiv = document.createElement('div');
    contentDiv.className = 'content';
    if (role === 'user') {
      contentDiv.textContent = content;
    } else {
      contentDiv.innerHTML = renderMarkdown(content);
      if (streaming) {
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        contentDiv.appendChild(cursor);
      }
    }
    div.appendChild(contentDiv);

    return div;
  }

  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  // Send message
  async function sendMessage() {
    const text = input.value.trim();
    if (!text || !selectedModel || isGenerating) return;

    welcome.style.display = 'none';
    isGenerating = true;
    sendBtn.textContent = 'Stop';

    // Add user message
    messages.push({ role: 'user', content: text });
    const userEl = createMessageEl('user', text, false);
    chatContainer.appendChild(userEl);
    scrollToBottom();

    input.value = '';
    autoResize(input);

    // Build request messages (include system prompt if set)
    const reqMessages = [];
    const sys = systemPrompt.value.trim();
    if (sys) reqMessages.push({ role: 'system', content: sys });
    reqMessages.push(...messages);

    // Create assistant message element for streaming
    const assistantEl = createMessageEl('assistant', '', true);
    chatContainer.appendChild(assistantEl);
    const contentDiv = assistantEl.querySelector('.content');
    scrollToBottom();

    let fullResponse = '';
    let tokenCount = 0;
    const startTime = performance.now();

    abortController = new AbortController();

    try {
      // Retry loop for 429 (model busy) — back off and retry up to 6 times
      const maxRetries = 6;
      let res;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: selectedModel,
            messages: reqMessages,
            stream: true
          }),
          signal: abortController.signal,
        });

        if (res.status !== 429 || attempt === maxRetries) break;

        // Show waiting status and back off: 1s, 2s, 4s, 8s, 16s, 32s
        const delay = Math.min(1000 * Math.pow(2, attempt), 32000);
        contentDiv.innerHTML = `<span style="color:var(--text-muted)">Model busy — retrying in ${(delay/1000).toFixed(0)}s… (${attempt + 1}/${maxRetries})</span>`;
        scrollToBottom();
        await new Promise((resolve, reject) => {
          const timer = setTimeout(resolve, delay);
          abortController.signal.addEventListener('abort', () => { clearTimeout(timer); reject(new DOMException('Aborted', 'AbortError')); }, { once: true });
        });
      }

      // Handle HTTP errors before trying to stream
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        const errMsg = errData.error || `Server error (${res.status})`;
        if (res.status === 503) {
          fullResponse = '[Model not loaded — use the Load button to load a model first]';
        } else if (res.status === 429) {
          fullResponse = '[Model is busy — still processing after retries. Try again shortly.]';
        } else {
          fullResponse = '[Error: ' + errMsg + ']';
        }
      } else {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const obj = JSON.parse(line);
              if (obj.error) {
                fullResponse += '\n\n[Error: ' + obj.error + ']';
                break;
              }
              if (obj.message && obj.message.content) {
                fullResponse += obj.message.content;
                tokenCount++;

                // Update display every few tokens for performance
                if (tokenCount % 3 === 0 || obj.done) {
                  contentDiv.innerHTML = renderMarkdown(fullResponse);
                  if (!obj.done) {
                    const cursor = document.createElement('span');
                    cursor.className = 'cursor';
                    contentDiv.appendChild(cursor);
                  }
                  scrollToBottom();
                }

                // Update speed
                const elapsed = (performance.now() - startTime) / 1000;
                if (elapsed > 0.5) {
                  const tps = (tokenCount / elapsed).toFixed(1);
                  speedIndicator.textContent = `${tps} tokens/s | ${tokenCount} tokens`;
                }
              }
              if (obj.done) break;
            } catch (_) {}
          }
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') {
        fullResponse += '\n\n[Error: ' + e.message + ']';
      }
    }

    // Final render
    contentDiv.innerHTML = renderMarkdown(fullResponse || '(empty response)');

    const elapsed = (performance.now() - startTime) / 1000;
    if (tokenCount > 0 && elapsed > 0) {
      const tps = (tokenCount / elapsed).toFixed(1);
      speedIndicator.textContent = `${tps} tokens/s | ${tokenCount} tokens | ${elapsed.toFixed(1)}s`;
    }

    messages.push({ role: 'assistant', content: fullResponse });
    isGenerating = false;
    abortController = null;
    sendBtn.textContent = 'Send';
    updateLoadButton();
    input.focus();
  }

  // Stop generation
  function stopGeneration() {
    if (abortController) {
      abortController.abort();
      abortController = null;
    }
    isGenerating = false;
    sendBtn.textContent = 'Send';
  }

  // Event listeners
  sendBtn.addEventListener('click', () => {
    if (isGenerating) {
      stopGeneration();
    } else {
      sendMessage();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!isGenerating) sendMessage();
    }
  });

  // Init
  fetchModels();
  setInterval(fetchModels, 30000); // Refresh model list every 30s
  input.focus();
})();
</script>
</body>
</html>
